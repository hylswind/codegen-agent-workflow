name: Build attestable AMI from spec

on:
  workflow_dispatch:
    inputs:
      repo:
        description: Public GitHub repository holding SPEC.md and the app (https URL)
        required: true
        type: string
      commit:
        description: Commit to build from (40 hex characters)
        required: true
        type: string
      model:
        description: Model for the agent (empty = Claude Code's default)
        required: false
        default: ""
        type: string
      max_iterations:
        description: Maximum number of review/fix rounds after the first generation
        required: false
        default: "3"
        type: string

permissions:
  contents: read
  id-token: write          # Sigstore signing for actions/attest
  attestations: write
  artifact-metadata: write

jobs:
  build:
    name: Generate app, build attestable AMI, sign statement
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      - name: Install latest tools and agent, free disk space
        run: |
          sudo apt-get update
          sudo apt-get install -y jq python3 python3-yaml python3-jsonschema
          bash agents/claude-code/install.sh
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          docker system prune -af >/dev/null 2>&1 || true
          df -h /

      - name: Check inputs
        env:
          REPO: ${{ inputs.repo }}
          COMMIT: ${{ inputs.commit }}
        run: |
          [[ "$REPO" =~ ^https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+(\.git)?/?$ ]] \
            || { echo "repo must be an https://github.com/<owner>/<name> URL"; exit 1; }
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "commit must be a 40-character hex SHA"; exit 1; }

      - name: Run agent pipeline
        env:
          AGENT_AUTH_TOKEN: ${{ secrets.AGENT_AUTH_TOKEN }}
          AGENT_MODEL: ${{ inputs.model }}
          MAX_ITERATIONS: ${{ inputs.max_iterations }}
          REPO: ${{ inputs.repo }}
          COMMIT: ${{ inputs.commit }}
        run: |
          bash pipeline/run-pipeline.sh --base-repo "$REPO" --base-commit "$COMMIT" --out app \
            --agent claude-code --max-iterations "$MAX_ITERATIONS" --report pipeline-report.json

      - name: Upload generated source
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: generated-source
          include-hidden-files: true
          path: |
            app
            !app/node_modules
            !app/dist
            pipeline-report.json

      - name: Build attestable AMI image
        run: bash ami/build-ami.sh app ami-out

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload image to S3
        id: s3
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_PREFIX: ${{ vars.S3_PREFIX }}
          RUN_ID: ${{ github.run_id }}
        run: |
          app_name=$(python3 -c 'import yaml; print(yaml.safe_load(open("app/app.yaml"))["name"])')
          key="${S3_PREFIX:+${S3_PREFIX%/}/}${app_name}/${RUN_ID}/image.raw"
          aws s3 cp ami-out/image.raw "s3://${S3_BUCKET}/${key}"
          echo "uri=s3://${S3_BUCKET}/${key}" >> "$GITHUB_OUTPUT"

      - name: Build statement (spec sha256, base commit, PCRs)
        env:
          REPO: ${{ inputs.repo }}
          COMMIT: ${{ inputs.commit }}
        run: |
          git -C app show "$COMMIT:SPEC.md" > spec.md     # the spec exactly as committed, untouched by the agent
          bash attest/make-statement.sh spec.md ami-out/pcr_measurements.json "$REPO" "$COMMIT" > statement.json

      - name: Sign statement (provenance of statement.json)
        id: attest
        uses: actions/attest@v4
        with:
          subject-path: statement.json

      - name: Upload statement
        uses: actions/upload-artifact@v7
        with:
          name: statement
          path: statement.json

      - name: Summary
        env:
          S3_URI: ${{ steps.s3.outputs.uri }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
        run: |
          {
            echo "- base: $(jq -r '.base.repo + " @ " + .base.commit' statement.json)"
            echo "- spec sha256: $(jq -r .spec.sha256 statement.json)"
            echo "- PCR4: $(jq -r .measurements.PCR4 statement.json)"
            echo "- PCR7: $(jq -r .measurements.PCR7 statement.json)"
            echo "- PCR12: $(jq -r .measurements.PCR12 statement.json)"
            echo "- statement sha256: $(sha256sum statement.json | cut -d' ' -f1)"
            echo "- attestation: $ATTESTATION_URL"
            echo "- image: $S3_URI"
          } >> "$GITHUB_STEP_SUMMARY"
